services:
  pg:
    image: postgres:16
    environment:
      POSTGRES_DB: studs
      POSTGRES_USER: studs
      POSTGRES_PASSWORD: studs
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studs -d studs"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    depends_on:
      pg:
        condition: service_healthy
    ports:
      - "8081:8080"
    restart: on-failure

  web:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
